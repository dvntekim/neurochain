name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: README tables match results
        run: uv run python scripts/update_readme.py --check
      # Datasets are not downloaded in CI; tests marked `data` skip themselves.
      - name: Tests
        run: uv run pytest --cov=neurochain --cov-report=term-missing:skip-covered
