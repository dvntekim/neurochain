[project]
name = "neurochain"
version = "0.1.0"
description = "Lowest-power neural sensing chain that still decodes under stimulation and electrode aging."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.scripts]
neurochain-data = "neurochain.data.download:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurochain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: needs a downloaded dataset; skipped when it is absent",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "NPY", "RUF"]
ignore = [
    "D203", # conflicts with D211 (no blank line before class docstring)
    "D213", # conflicts with D212 (summary on the first docstring line)
    "RUF001", # µ and σ in strings are intentional
    "RUF002", # µ and σ in docstrings are intentional
    "RUF003", # µ and σ in comments are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
