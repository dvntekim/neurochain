# Hooks run the tools pinned in uv.lock, so local checks and CI always agree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: readme-in-sync
        name: README tables match results/*.json
        entry: uv run python scripts/update_readme.py --check
        language: system
        files: ^(README\.md|results/.*\.json|scripts/update_readme\.py)$
        pass_filenames: false
      - id: no-data-files
        name: no data files committed
        entry: data files must not be committed (see CLAUDE.md)
        language: fail
        files: \.(wav|nwb|mat|zip|npz|npy|h5|hdf5)$
